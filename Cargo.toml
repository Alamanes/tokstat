[package]
name = "tokstat"
version = "0.1.0"
edition = "2021"
description = "pi-agent 会话日志 Token 用量统计 CLI，支持 GitHub 风格热力图"
license = "MIT"
repository = "https://github.com/Shiorangerin/tokstat"

[dependencies]
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
